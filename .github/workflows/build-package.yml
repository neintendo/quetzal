# This workflow will do a clean installation of node dependencies, cache/restore them,
# build the source code and run tests across different versions of node. Then package the backend
# into a python executable file to be finally bundled with the Electron package.

name: Build & Package

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  # pull_request:
  #   branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        python-version: [3.15.x]

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'quetzal_react/package-lock.json'

    - name: Use Python 3.15
      uses: actions/setup-python@v5
      with:
        python-version: '3.15.x'
        cache: 'pip'

    - name: Install dependencies
      run: npm ci
      working-directory: ./quetzal_react

    - name: Install Python Dependencies & Create Installer
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pyinstaller quetzal_django.spec

    - name: Build
      run: npm run build --if-present
      working-directory: ./quetzal_react

    - name: Make Distributables
      run: npm run make
      working-directory: ./quetzal_react

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: quetzal
        path: |
            quetzal_react/out/
            dist/
        if-no-files-found: warn
